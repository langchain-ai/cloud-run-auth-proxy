# This file is overwritten at runtime by entrypoint.sh which generates the
# envoy configuration based on environment variables. It is kept here as a
# reference showing the default configuration (no proxy, no upstream path,
# JWT + ext_authz enabled) that entrypoint.sh produces for a basic setup
# like UPSTREAM_URL=https://api.anthropic.com.
#
# See entrypoint.sh for the full set of supported environment variables and
# the conditional logic that mirrors helm chart v0.0.5.
static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: upstream
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: upstream_provider
                            host_rewrite_literal: api.anthropic.com
                            timeout: 0s
                            idle_timeout: 300s
                http_filters:
                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      headers:
                        - name: ":path"
                          string_match:
                            exact: "/healthz"
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        langsmith_jwt:
                          issuer: langsmith
                          audiences:
                            - "test-audience"
                          local_jwks:
                            inline_string: 'JWKS_JSON_PLACEHOLDER'
                          from_headers:
                            - name: X-LangSmith-LLM-Auth
                          forward: true
                      rules:
                        - match:
                            prefix: "/"
                          requires:
                            provider_name: langsmith_jwt
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      allowed_headers:
                        patterns:
                          - safe_regex:
                              regex: ".*"
                      http_service:
                        server_uri:
                          uri: http://localhost:10002
                          cluster: ext_authz_service
                          timeout: 10s
                        path_prefix: "/check"
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - safe_regex:
                                  regex: ".*"
                          allowed_client_headers:
                            patterns:
                              - exact: "www-authenticate"
                              - prefix: "x-"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: upstream_provider
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: upstream_provider
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.anthropic.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.anthropic.com
    - name: ext_authz_service
      connect_timeout: 5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: ext_authz_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10002
